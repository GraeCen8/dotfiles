# ~/.config/tmux/tmux.conf

# Omarchy-style tmux configuration
# Catppuccin Mocha status bar

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
set -sg escape-time 10
set -g pane-border-lines simple

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows / panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"

unbind %
bind = split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind x
bind x kill-pane

unbind X
bind X kill-window

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + hjkl pane navigation
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# Custom: New session (workspace) with rename prompt on prefix-n
unbind n
bind n command-prompt -p "New session name:" "new-session -s '%%'"


# Alt + number window selection
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"


# ============================================================
# Catppuccin Mocha
# ============================================================

# Status bar
set -g status on
set -g status-bg "#1e1e2e"
set -g status-justify left
set -g status-left-length 100
set -g status-right-length 100

# Messages
set -g message-style "fg=#94e2d5,bg=#585b70,align=centre"
set -g message-command-style "fg=#94e2d5,bg=#585b70,align=centre"

# Panes
set -g pane-border-style "fg=#585b70"
set -g pane-active-border-style "fg=#89b4fa"

# Windows
set -g window-status-format "■ "
set -g window-status-current-format "■■ "

set -g window-status-current-style \
				"fg=red,nobold"

set -g window-status-bell-style "fg=red,nobold"

set -g window-status-style "fg=white"

# Other windows

# Right side
set -g status-right "#[fg=#89b4fa,bg=#1e1e2e,nobold,nounderscore,noitalics]█#[fg=#1e1e2e,bg=#89b4fa,nobold,nounderscore,noitalics] #[fg=#cdd6f4,bg=#585b70] #W #{?client_prefix,#[fg=#f5c2e7],#[fg=#94e2d5]}#[bg=#585b70]█#{?client_prefix,#[bg=#f5c2e7],#[bg=#94e2d5]}#[fg=#1e1e2e] #[fg=#cdd6f4,bg=#585b70] #S "

set -g status-left ""

# Modes
set -g clock-mode-colour "#89b4fa"
set -g mode-style "fg=#89b4fa bg=#45475a bold"


# ============================================================
# Plugins: TPM (Tmux Plugin Manager), tmux-resurrect, tmux-continuum
# ============================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @resurrect-strategy-vim 'session'
set -g @continuum-save-interval '5'

# TPM must be last
run '~/.tmux/plugins/tpm/tpm'

