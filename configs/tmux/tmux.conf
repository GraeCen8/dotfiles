# ~/.config/tmux/tmux.conf

# Omarchy-style tmux configuration
# Oxocarbon Dark status bar (matches dwl + st)

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
# Allow OSC escape sequences (e.g. clipboard) to pass through to the terminal
set -g allow-passthrough on
set -sg escape-time 10
set -g pane-border-lines simple

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows / panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"

unbind %
bind = split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind x
bind x kill-pane

unbind X
bind X kill-window

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + hjkl pane navigation
bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# Custom: New session (workspace) with rename prompt on prefix-n
unbind n
bind n command-prompt -p "New session name:" "new-session -s '%%'"


# Alt + number window selection
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"


# ============================================================
# Oxocarbon Dark
# bg: #161616  surface: #262626  border: #393939
# muted: #525252  dim: #8d8d8d  text: #f2f4f8  accent: #78a9ff
# red: #fa4d56  magenta: #ee5396  cyan: #3ddbd9  purple: #be95ff
# ============================================================

# ── Centered ─────────────────────────────────────────────────
# Status bar
set -g status on
set -g status-bg "#161616"
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# Messages
set -g message-style "fg=#3ddbd9,bg=#262626,align=right"
set -g message-command-style "fg=#3ddbd9,bg=#262626,align=right"

# Panes
set -g pane-border-style "fg=#262626"
set -g pane-active-border-style "fg=#78a9ff"

# Windows
set -g window-status-format "#[fg=#525252] #I:#W "
set -g window-status-current-format "#[fg=#161616,bg=#78a9ff] #I:#W "
set -g window-status-current-style "fg=#161616,bold"
set -g window-status-style "fg=#8d8d8d"
set -g window-status-bell-style "fg=#fa4d56,bold"

# Right side
set -g status-right "#[fg=#78a9ff]│ #[fg=#3ddbd9]#H "

# Left side
set -g status-left "#[fg=#78a9ff]#S #[fg=#525252]│ "

# Modes
set -g clock-mode-colour "#78a9ff"
set -g mode-style "fg=#78a9ff bg=#393939 bold"


