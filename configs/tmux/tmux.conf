# ~/.config/tmux/tmux.conf

# Omarchy-style tmux configuration
# Tokyo Night status bar

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:RGB"
set -g mouse on
set -g set-clipboard on
# Let OSC 7 (cwd reports for foot spawn-terminal) pass through to the terminal
set -g allow-passthrough on
set -sg escape-time 10
set -g pane-border-lines simple

# Prefix
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Windows / panes
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

bind c new-window -c "#{pane_current_path}"

unbind %
bind = split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind x
bind x kill-pane

unbind X
bind X kill-window

# Vim pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Alt + hjkl pane navigation
bind -n M-h select-pane -L
# bind -n M-j select-pane -D
# bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Window navigation
bind -n S-Left previous-window
bind -n S-Right next-window

# Custom: New session (workspace) with rename prompt on prefix-n
unbind n
bind n command-prompt -p "New session name:" "new-session -s '%%'"


# Alt + number window selection
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Copy mode
set-window-option -g mode-keys vi

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
unbind r
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded"


# ============================================================
# Tokyo Night
# bg: #1a1b26  surface: #24283b  overlay: #414868
# muted: #565f89  text: #c0caf5  blue: #7aa2f7
# red: #f7768e  yellow: #e0af68  cyan: #7dcfff  purple: #bb9af7
# ============================================================

# ── Centered ─────────────────────────────────────────────────
# Status bar
set -g status on
set -g status-bg "#1a1b26"
set -g status-justify centre
set -g status-left-length 100
set -g status-right-length 100

# Messages
set -g message-style "fg=#7dcfff,bg=#24283b,align=right"
set -g message-command-style "fg=#7dcfff,bg=#24283b,align=right"

# Panes
set -g pane-border-style "fg=#24283b"
set -g pane-active-border-style "fg=#7aa2f7"

# Windows
set -g window-status-format "#[fg=#565f89] #I:#W "
set -g window-status-current-format "#[fg=#1a1b26,bg=#7aa2f7] #I:#W "
set -g window-status-current-style "fg=#1a1b26,bold"
set -g window-status-style "fg=#9aa5ce"
set -g window-status-bell-style "fg=#f7768e,bold"

# Right side
set -g status-right "#[fg=#7aa2f7]│ #[fg=#7dcfff]#H "

# Left side
set -g status-left "#[fg=#7aa2f7]#S #[fg=#565f89]│ "

# Modes
set -g clock-mode-colour "#7aa2f7"
set -g mode-style "fg=#7aa2f7 bg=#414868 bold"


