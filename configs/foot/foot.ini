# -*- conf -*-
# foot - Wayland native terminal.
# Mirrors configs/st/config.h (st-wl / st-flexipatch with every patch disabled):
# palette, foreground/background, selection and cursor colors, padding, initial
# size, and key bindings all come from there.
#
# Deliberate foot-only keepers (nothing to match in unpatched st):
#  - scrollback buffer: 10000 lines (st has no scrollback without patches)
#  - spawn-terminal=Ctrl+Shift+n and search-start=Ctrl+Shift+f
#  - URL underlining (foot default behavior)
#
# Not reproducible in foot:
#  - termname st-wl-256color (kept term=foot; foot ships its own terminfo)
#  - st brightens colors 0-7 for bold text; foot renders bold in the same color
#  - cursor thickness (3), word delimiters, selection timeouts, key repeat rate

[main]
term=foot
# st: "Liberation Mono:pixelsize=16" = 12pt @ 96dpi (bump this if your output scale != 1)
font=Liberation Mono:size=12
# st: borderpx=2
pad=2x2
# st: cols=80 rows=24
initial-window-size-chars=80x24

[csd]
preferred=server

[scrollback]
lines=10000

[cursor]
# st: cursorshape=2 (steady block, no blinking-cursor patch)
style=block
blink=no

[mouse]
# st: HIDECURSOR patch off, pointer never hides while typing
hide-when-typing=no
alternate-scroll-mode=yes

[colors-dark]
# foot-only: background translucency (1.0 = opaque)
alpha=0.9
# st colorname 258=bg, 259=fg, 256=cursor, 257=reverse-cursor
foreground=dde1e6
background=161616
# st colorname[0..7] (normal)
regular0=262626
regular1=ff7eb6
regular2=42be65
regular3=82cfff
regular4=33b1ff
regular5=ee5396
regular6=3ddbd9
regular7=dde1e6
# st colorname[8..15] (bright)
bright0=393939
bright1=ff7eb6
bright2=42be65
bright3=82cfff
bright4=33b1ff
bright5=ee5396
bright6=3ddbd9
bright7=ffffff
# st: selectioncolors patch off -> reverse video (fg/bg swapped)
selection-foreground=161616
selection-background=dde1e6
# st: defaultcs=f2f4f8 cursor block, text inside it drawn in defaultbg=161616
cursor=161616 f2f4f8
flash=ff7eb6
flash-alpha=0.5

[key-bindings]
# st: MODKEY=Alt, TERMMOD=Ctrl+Shift
# st: TERMMOD+C/V clipcopy/clippaste (replaces the old foot Alt+c/v overrides)
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
# st: Shift+Insert and Ctrl+Shift+Y both paste the PRIMARY selection
primary-paste=Shift+Insert Control+Shift+y
# st: zoom on Ctrl+Shift+Prior/Next (TERMMOD) and Alt+Shift+K/J (MODKEY|SHIFT)
font-increase=Control+Shift+Page_Up Alt+Shift+k
font-decrease=Control+Shift+Page_Down Alt+Shift+j
# st: TERMMOD+Home zoomreset
font-reset=Control+Shift+Home
# foot-only conveniences (st equivalents exist only behind disabled patches)
# spawn-terminal also on Alt+Return: opens in the shell's cwd (requires OSC 7 from the shell)
spawn-terminal=Control+Shift+n Alt+Return
search-start=Control+Shift+f
