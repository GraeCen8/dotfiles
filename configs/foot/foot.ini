# -*- conf -*-
# foot - Wayland native terminal (replaces the old X11 st + xwayland-satellite setup).
# Ported from the old st config.h: Tokyo Night colors, JetBrainsMono Nerd Font,
# 90% opacity via mango windowrule (see ~/.config/mango/config.conf), block cursor,
# Alt+c/v copy-paste, Ctrl+Shift+k/j font size,
# Ctrl+Shift+n spawns a new terminal in the same cwd (needs OSC 7 from shell).

[main]
term=foot
font=JetBrainsMono Nerd Font Mono:size=16
pad=2x2
initial-window-size-chars=80x24

[csd]
preferred=server

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
blink-rate=800

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
foreground=c0caf5
background=1f2335
regular0=15161e
regular1=f7768e
regular2=9ece6a
regular3=e0af68
regular4=7aa2f7
regular5=bb9af7
regular6=7dcfff
regular7=a9b1d6
bright0=414868
bright1=f7768e
bright2=9ece6a
bright3=e0af68
bright4=7aa2f7
bright5=bb9af7
bright6=7dcfff
bright7=c0caf5
selection-foreground=c0caf5
selection-background=33467c
cursor=1a1b26 c0caf5
flash=e0af68
flash-alpha=0.5

[key-bindings]
clipboard-copy=Mod1+c
clipboard-paste=Mod1+v
primary-paste=Shift+Insert
font-increase=Control+Shift+k Control+Shift+plus
font-decrease=Control+Shift+j Control+Shift+minus
font-reset=Control+Shift+Home
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f
