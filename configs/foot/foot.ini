# -*- conf -*-
# foot - Wayland native terminal (replaces the old X11 st + xwayland-satellite setup).
# Oxocarbon Dark (shaunsingh/IBM Carbon), matches the dwl theme:
# bg #161616  fg #f2f4f8  surface #262626  border #393939  muted #525252
# 90% opacity via dwl window rule + alphafocus patch (foot rule in config.def.h;
# applied server-side by dwl, foot needs no client-side alpha), block cursor,
# Alt+c/v copy-paste, Ctrl+Shift+k/j font size,
# Ctrl+Shift+n spawns a new terminal in the same cwd (needs OSC 7 from shell).

[main]
term=foot
font=JetBrainsMono Nerd Font Mono:size=16
pad=2x2
initial-window-size-chars=80x24

[csd]
preferred=server

[scrollback]
lines=10000

[cursor]
style=block
blink=yes
blink-rate=800

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[colors-dark]
foreground=f2f4f8
background=161616
regular0=161616
regular1=ee5396
regular2=42be65
regular3=ff7eb6
regular4=33b1ff
regular5=be95ff
regular6=3ddbd9
regular7=f2f4f8
bright0=525252
bright1=ff7eb6
bright2=42be65
bright3=ff7eb6
bright4=82cfff
bright5=be95ff
bright6=3ddbd9
bright7=ffffff
selection-foreground=161616
selection-background=78a9ff
cursor=161616 78a9ff
flash=ff7eb6
flash-alpha=0.5

[key-bindings]
clipboard-copy=Mod1+c
clipboard-paste=Mod1+v
primary-paste=Shift+Insert
font-increase=Control+Shift+k Control+Shift+plus
font-decrease=Control+Shift+j Control+Shift+minus
font-reset=Control+Shift+Home
spawn-terminal=Control+Shift+n
search-start=Control+Shift+f
