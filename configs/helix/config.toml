theme = "rose_pine"

[editor]
cursorline = true
bufferline = "always"
true-color = true
trim-trailing-whitespace = true
insert-final-newline = true
popup-border = "all"
end-of-line-diagnostics = "hint"
auto-format = true
completion-timeout = 5
auto-save = true
scrolloff = 15
completion-replace = true

[editor.soft-wrap]
enable = true

[editor.lsp]
snippets = true
display-progress-messages = true

# [editor.word-completion] # master branch
# enable = true
# trigger-length = 1

[editor.cursor-shape]
insert = "bar"

[keys.normal]
C-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
"-" = "command_mode"
"A-f" = ":format"

[keys.insert.j]
k = "normal_mode"
d = "delete_word_backward"

[keys.normal.space]
t = ":pipe sed -e 's/- \\[ \\]/- [x]/;t' -e 's/- \\[x\\]/- [ ]/;t' -e 's/^- /- [ ] /'"
x = ":buffer-close"
o = ":buffer-close-others"

