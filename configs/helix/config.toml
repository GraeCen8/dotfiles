theme = "grae"

[editor]
bufferline = "always"
trim-trailing-whitespace = true
popup-border = "none"
end-of-line-diagnostics = "hint"
completion-timeout = 5
scrolloff = 15
completion-replace = true
true-color = true

[editor.auto-save.after-delay]
enable = true
timeout = 1000

[editor.soft-wrap]
enable = true

[editor.lsp]
snippets = true
display-progress-messages = true

# [editor.word-completion] # master branch
# enable = true
# trigger-length = 1

[editor.cursor-shape]
insert = "bar"

[keys.normal]
C-g = [":new", ":insert-output lazygit", ":buffer-close!", ":redraw"]
"-" = "command_mode"
"A-f" = ":format"

[keys.insert.j]
k = "normal_mode"
d = "delete_word_backward"

[keys.normal.space]
x = ":buffer-close"
o = ":buffer-close-others"

