# beets — music library manager
# Managed via pkg: ~/dots/configs/beets/config.yaml -> ~/.config/beets/config.yaml

directory: ~/Music
library: ~/.local/share/beets/library.db

ui:
  color: yes

import:
  move: yes      # restructure into Artist/Album folders on import
  copy: no
  write: yes     # write tags back into the .flac files
  resume: ask
  log: ~/.local/share/beets/import.log

paths:
  default: $albumartist/$album%aunique{}/$track $title
  singleton: Non-Album/$artist/$title
  comp: Compilations/$album%aunique{}/$track $title

plugins: fetchart embedart lyrics lastgenre scrub

fetchart:
  auto: yes
embedart:
  auto: yes
lyrics:
  auto: yes
  synced: yes
lastgenre:
  auto: yes
  count: 1
scrub:
  auto: yes
