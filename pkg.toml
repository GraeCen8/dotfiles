[config]
mode = "pkg"
# stow = []       # these configs mirror into $HOME (GNU stow style)


[git]
url = "git@github.com:graecen8/dotfiles.git"

[[system]]
name = "base"
packages = [
    "base-devel",
    "bat",
    "btop",
    "eza",
    "fastfetch",
    "fd",
    "foot",
    "fzf",
    "git",
    "github-cli",
    "grim",
    "helix",
    "imv",
    "just",
    "lazygit",
    "lutris",
    "ly",
    "mako",
    "neovim",
    "opencode",
    "python-adblock",
    "python-pip",
    "qutebrowser",
    "slurp",
    "sway",
    "swaybg",
    "swayidle",
    "swaylock",
    "tmux",
    "tree-sitter",
    "tree-sitter-cli",
    "ttf-jetbrains-mono-nerd",
    "waybar",
    "wayland",
    "wayland-protocols",
    "wiremix",
    "wl-clipboard",
    "wmenu",
    "xorg-xwayland",
    "zathura-pdf-mupdf",
    "zoxide",
    "zsh",
    "zsh-syntax-highlighting",
