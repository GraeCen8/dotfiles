[config]
mode = "pkg"
# stow = []       # these configs mirror into $HOME (GNU stow style)
# mode = "stow"        # make every config stow-style


# [git]
# url = "git@github.com:you/dots.git"

[[system]]
name = "base"
packages = [
    "autotiling",
    "base-devel",
    "bat",
    "btop",
    "eza",
    "fastfetch",
    "fd",
    "foot",
    "fzf",
    "git",
    "github-cli",
    "grim",
    "helix",
    "imv",
    "just",
    "lazygit",
    "lua-language-server",
    "ly",
    "neovim",
    "opencode",
    "python-adblock",
    "python-pip",
    "qutebrowser",
    "slurp",
    "sway",
    "swaybg",
    "swayidle",
    "swaylock",
    "tmux",
    "tree-sitter",
    "tree-sitter-cli",
    "ttf-jetbrains-mono-nerd",
    "wayland",
    "wayland-protocols",
    "wl-clipboard",
    "wlroots0.20",
    "wmenu",
    "xdg-desktop-portal-wlr",
    "xorg-xwayland",
    "zoxide",
    "zsh",
    # nested roots: machine-specific dirs, each a full root with its own pkg.toml + configs/
    # (see pkg docs/configuration.md: modules = "Top-level directories that are their own roots")
    "zsh-syntax-highlighting",
]

# nested roots: machine-specific dirs, each a full root with its own pkg.toml + configs/
# (see pkg docs/configuration.md: modules = "Top-level directories that are their own roots")
[[system]]
name = "modules"
modules = ["pc"]

