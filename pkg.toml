[config]
mode = "pkg"
stow = ["firefox"]       # these configs mirror into $HOME (GNU stow style)
# mode = "stow"        # make every config stow-style

# [modules]
# on = ["nvim"]        # top-level dirs that are their own roots
#                      # (own pkg.toml + configs/)

[[system]]
packages = [
# apps
  "kitty",
	"zen-browser-bin",

# shell
	"fish",
	"cloc",
	"herdr",
	"lazygit",
  "nvim",
	"opencode",
	"starship",
	"tmux",

  # langs
  "python",
  "go",
  "rustup",
	"zig",

  # lsps
  "rust-analyzer",
  "rustfmt",
  "gopls",
  "pyright",
  "python-black",
  "bash-language-server",
  "shfmt",
  "taplo",
  "typescript-language-server",
  "prettier",
  "zls",
  "ols",
  "clang",
]

[hooks]
